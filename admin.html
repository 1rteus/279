<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="📚">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="manifest.json">
    <title>📚 Админ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <style>
        .login{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
        .login-box{background:var(--surface);border-radius:20px;padding:32px 24px;width:100%;max-width:340px;text-align:center}
        .login-box h2{margin-bottom:20px;font-size:1.2em}
        .login-box h2 span{color:var(--accent)}
        .tabs{display:flex;gap:6px;margin:16px 0;overflow-x:auto;padding-bottom:4px}
        .tab{padding:10px 14px;border:none;border-radius:12px;background:var(--surface);color:var(--dim);font-size:0.78em;font-weight:700;cursor:pointer;white-space:nowrap;transition:all 0.2s}
        .tab.active{background:var(--accent);color:#fff}
        .tab-panel{display:none}
        .tab-panel.active{display:block}
        .field{margin-bottom:14px}
        .field label{display:block;font-size:0.75em;color:var(--dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
        .field select,.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--surface2);border-radius:12px;background:var(--surface2);color:var(--text);font-size:0.9em;font-family:inherit;outline:none;transition:border-color 0.2s;-webkit-appearance:none}
        .field select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
        .field textarea{min-height:70px;resize:vertical}
        .btn{padding:12px 20px;border:none;border-radius:12px;font-size:0.85em;font-weight:700;cursor:pointer;transition:all 0.2s}
        .btn:active{transform:scale(0.97)}
        .btn-accent{background:var(--accent);color:#fff}
        .btn-green{background:var(--green);color:#000}
        .btn-red{background:var(--red);color:#fff}
        .btn-sm{padding:8px 14px;font-size:0.75em}
        .btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
        .msg{padding:10px 14px;border-radius:10px;font-size:0.8em;margin-bottom:12px}
        .msg.ok{background:rgba(0,206,201,0.12);color:var(--green)}
        .msg.err{background:rgba(255,107,107,0.12);color:var(--red)}
        .item{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:8px}
        .item-top{display:flex;justify-content:space-between;align-items:center}
        .item-title{font-weight:600;font-size:0.85em}
        .item-sub{color:var(--dim);font-size:0.78em;margin-top:4px}
        .back{display:inline-block;margin-bottom:16px;color:var(--dim);text-decoration:none;font-size:0.85em}
        .admin-head{text-align:center;padding:20px 0 4px}
        .admin-head h1{font-size:1.3em}
        .admin-head h1 span{color:var(--accent)}
        .admin-head p{color:var(--dim);font-size:0.8em;margin-top:2px}
        .section-label{font-size:0.72em;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px}
        .week-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
        .week-nav .btn{background:var(--surface2);color:var(--dim)}
    </style>
</head>
<body>
    <div id="login-screen" class="login">
        <div class="login-box">
            <a href="index.html" class="back">&larr; Назад</a>
            <h2><span>279</span> Админ</h2>
            <div class="field"><label>Пароль</label><input type="password" id="pw" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;"></div>
            <div id="login-msg"></div>
            <button class="btn btn-accent" style="width:100%" onclick="doLogin()">Войти</button>
        </div>
    </div>

    <div id="panel" class="hidden" style="max-width:480px;margin:0 auto;padding:0 16px 40px">
        <div class="admin-head"><h1>📚 Админ</h1><p>Управление расписанием</p></div>

        <div class="tabs">
            <button class="tab active" data-t="hw">ДЗ</button>
            <button class="tab" data-t="rep">Замены</button>
            <button class="tab" data-t="bell">Звонки</button>
        </div>

        <div id="p-hw" class="tab-panel active">
            <div class="week-nav">
                <button class="btn btn-sm" onclick="changeHWWeek(-1)">&#8249; Неделя</button>
                <span id="hw-week-label" style="font-size:0.8em;font-weight:600;color:var(--dim)">Эта неделя</span>
                <button class="btn btn-sm" onclick="changeHWWeek(1)">Неделя &#8250;</button>
            </div>
            <div class="field"><label>День</label>
                <select id="hw-day"><option value="1">Понедельник</option><option value="2">Вторник</option><option value="3">Среда</option><option value="4">Четверг</option><option value="5">Пятница</option></select>
            </div>
            <div class="field"><label>Урок</label>
                <select id="hw-num"></select>
            </div>
            <div class="field"><label>Задание</label>
                <textarea id="hw-text" placeholder="Текст задания..."></textarea>
            </div>
            <div id="hw-msg"></div>
            <button class="btn btn-green" onclick="addHW()">Добавить ДЗ</button>
            <div class="section-label">Домашние задания</div>
            <div id="hw-all"></div>
        </div>

        <div id="p-rep" class="tab-panel">
            <div class="field"><label>День недели замены</label>
                <select id="rep-day"><option value="1">Понедельник</option><option value="2">Вторник</option><option value="3">Среда</option><option value="4">Четверг</option><option value="5">Пятница</option></select>
            </div>
            <div class="field"><label>Какой урок заменяем</label>
                <select id="rep-num"></select>
            </div>
            <div class="field"><label>Заменить на предмет</label>
                <select id="rep-subject"></select>
            </div>
            <div class="field"><label>Кабинет (оставь пустым = свой)</label>
                <input id="rep-room" placeholder="Номер кабинета">
            </div>
            <div id="rep-msg"></div>
            <button class="btn btn-accent" onclick="addRep()">Добавить замену</button>
            <div class="section-label">Все замены на этой неделе</div>
            <div id="rep-all"></div>
        </div>

        <div id="p-bell" class="tab-panel">
            <div class="section-label">Расписание звонков по дням недели</div>
            <div class="bell-grid" id="bell-grid"></div>
            <div class="section-label">Текущее расписание</div>
            <div id="bell-table"></div>
        </div>

        <div style="text-align:center;margin-top:24px">
            <button class="btn btn-red btn-sm" onclick="localStorage.removeItem('admin_ok');location.reload()">Выйти</button>
        </div>
    </div>

    <script>
    var PW_FALLBACK = "279admin";
    var hwWeekOffset = 0;

    var ALL_SUBJECTS = [
        "Материаловед","ФКиз","Биология","СПТ сл-ремонтн","Допуски, пос",
        "Общ курс сл д","Химия","Ин язык","Математика","ннф час",
        "География","Защита насел","Ист Бел в к ВИ","Бел язык","Бел литерат",
        "Физика","курат час","Рус язык","Рус литерат"
    ];

    var LESSONS = {
        1: [{n:1,nm:"Материаловед",rm:"201"},{n:2,nm:"ФКиз",rm:"2"},{n:3,nm:"Биология",rm:"305"},{n:4,nm:"СПТ сл-ремонтн",rm:"201"},{n:0,lunch:1},{n:6,nm:"Допуски, пос",rm:"401"},{n:7,nm:"Допуски, пос",rm:"401"},{n:8,nm:"Общ курс сл д",rm:"110"}],
        2: [{n:1,nm:"Химия",rm:"301"},{n:2,nm:"Ин язык",rm:"306"},{n:3,nm:"Математика",rm:"405"},{n:4,nm:"Математика",rm:"405"},{n:5,nm:"СПТ сл-ремонтн",rm:"201"},{n:6,nm:"ннф час",rm:"102"},{n:7,nm:"География",rm:"305"},{n:8,nm:"Защита насел",rm:"403"}],
        3: [{n:1,nm:"Ист Бел в к ВИ",rm:"101"},{n:2,nm:"Биология",rm:"305"},{n:3,nm:"СПТ сл-ремонтн",rm:"201"},{n:4,nm:"Материаловед",rm:"201"},{n:0,lunch:1},{n:6,nm:"ФКиз",rm:"2"},{n:7,nm:"Бел язык",rm:"111"},{n:8,nm:"Бел литерат",rm:"111"}],
        4: [{n:1,nm:"Химия",rm:"301"},{n:2,nm:"География",rm:"305"},{n:3,nm:"Физика",rm:"308"},{n:4,nm:"Ин язык",rm:"306"},{n:5,nm:"Математика",rm:"405"},{n:6,nm:"курат час",rm:"101"},{n:7,nm:"Математика",rm:"405"},{n:8,nm:"Рус язык",rm:"404"},{n:9,nm:"Рус литерат",rm:"404"}],
        5: [{n:1,nm:"Общ курс сл д",rm:"110"},{n:2,nm:"ФКиз",rm:"2"},{n:3,nm:"СПТ сл-ремонтн",rm:"201"},{n:4,nm:"Физика",rm:"308"},{n:5,nm:"Общ курс сл д",rm:"110"},{n:0,lunch:1},{n:7,nm:"Допуски, пос",rm:"401"},{n:8,nm:"Ист Бел в к ВИ",rm:"101"}]
    };

    var DN = ["","Пн","Вт","Ср","Чт","Пт"];

    function getMonday(d) {
        var date = new Date(d);
        var day = date.getDay();
        var diff = day === 0 ? -6 : 1 - day;
        date.setDate(date.getDate() + diff);
        return date;
    }

    function formatDate(d) {
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }

    function getWeekKey(offset) {
        var now = new Date();
        var monday = getMonday(now);
        monday.setDate(monday.getDate() + (offset * 7));
        return formatDate(monday);
    }

    function getWeekLabel(offset) {
        if (offset === 0) return "Эта неделя";
        return "Следующая";
    }

    function getLessonName(day, n) {
        var list = LESSONS[day] || [];
        for (var i = 0; i < list.length; i++) {
            if (list[i].n === n) return list[i].nm;
        }
        return "";
    }

    function doLogin() {
        var pw = document.getElementById("pw").value;
        FirebaseDB.get("config_admin_pw", function(data) {
            var correctPw = (data && data.value) ? data.value : PW_FALLBACK;
            if (pw === correctPw) {
                localStorage.setItem("admin_ok", "1");
                location.reload();
            } else {
                document.getElementById("login-msg").innerHTML = '<div class="msg err">Неверный пароль</div>';
            }
        });
    }

    document.getElementById("pw").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });

    if (localStorage.getItem("admin_ok")) {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("panel").classList.remove("hidden");
        initAdmin();
    }

    function initAdmin() {
        var numSel = document.getElementById("hw-num");
        var repNumSel = document.getElementById("rep-num");
        for (var i = 1; i <= 9; i++) {
            var o1 = document.createElement("option"); o1.value = i; o1.textContent = i + " урок"; numSel.appendChild(o1);
            var o2 = document.createElement("option"); o2.value = i; o2.textContent = i + " урок"; repNumSel.appendChild(o2);
        }

        var subSel = document.getElementById("rep-subject");
        ALL_SUBJECTS.forEach(function(s) {
            var o = document.createElement("option"); o.value = s; o.textContent = s; subSel.appendChild(o);
        });

        document.querySelectorAll(".tab").forEach(function(t) {
            t.addEventListener("click", function() {
                document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
                document.querySelectorAll(".tab-panel").forEach(function(x) { x.classList.remove("active"); });
                t.classList.add("active");
                document.getElementById("p-" + t.dataset.t).classList.add("active");
            });
        });

        buildBellGrid();
        loadHW();
        loadRep();
    }

    function changeHWWeek(dir) {
        hwWeekOffset += dir;
        if (hwWeekOffset > 1) hwWeekOffset = 1;
        if (hwWeekOffset < 0) hwWeekOffset = 0;
        document.getElementById("hw-week-label").textContent = getWeekLabel(hwWeekOffset);
        loadHW();
    }

    function loadHW() {
        var path = "hw_" + getWeekKey(hwWeekOffset);
        FirebaseDB.get(path, function(hw) {
            hw = hw || {};
            var c = document.getElementById("hw-all");
            var html = "";
            for (var d = 1; d <= 5; d++) {
                var dayHw = hw[String(d)] || [];
                for (var i = 0; i < dayHw.length; i++) {
                    var h = dayHw[i];
                    var name = getLessonName(d, h.n);
                    html += '<div class="item"><div class="item-top"><span class="item-title">' + DN[d] + ' · урок ' + h.n + ': ' + name + '</span></div><div class="item-sub">' + h.t + '</div><div class="btn-row"><button class="btn btn-red btn-sm" onclick="delHW(\'' + d + '\',' + h.n + ')">Удалить</button></div></div>';
                }
            }
            c.innerHTML = html || '<div class="item-sub">Нет заданий</div>';
        });
    }

    function loadRep() {
        FirebaseDB.get("reps", function(reps) {
            reps = reps || {};
            var c = document.getElementById("rep-all");
            var now = new Date();
            var monday = getMonday(now);
            var html = "";
            for (var d = 1; d <= 5; d++) {
                var dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + (d - 1));
                var dateStr = formatDate(dayDate);
                var key = String(d) + "_" + dateStr;
                var arr = reps[key] || [];
                for (var i = 0; i < arr.length; i++) {
                    var r = arr[i];
                    var orig = getLessonName(d, r.n);
                    html += '<div class="item"><div class="item-top"><span class="item-title">' + DN[d] + ' · урок ' + r.n + ': ' + orig + ' → ' + r.name + (r.room ? ' (' + r.room + ')' : '') + '</span></div><div class="btn-row"><button class="btn btn-red btn-sm" onclick="delRep(\'' + key + '\',' + r.n + ')">Удалить</button></div></div>';
                }
            }
            c.innerHTML = html || '<div class="item-sub">Нет замен на этой неделе</div>';
        });
    }

    function findNearestLesson(subject, excludeDay, excludeNum) {
        for (var d = 1; d <= 5; d++) {
            var list = LESSONS[d] || [];
            for (var i = 0; i < list.length; i++) {
                if (list[i].nm === subject && !(d === excludeDay && list[i].n === excludeNum)) {
                    return { day: d, num: list[i].n };
                }
            }
        }
        return null;
    }

    function addHW() {
        var day = document.getElementById("hw-day").value;
        var n = +document.getElementById("hw-num").value;
        var txt = document.getElementById("hw-text").value.trim();
        if (!txt) { document.getElementById("hw-msg").innerHTML = '<div class="msg err">Введите задание</div>'; return; }
        var path = "hw_" + getWeekKey(hwWeekOffset);
        FirebaseDB.get(path, function(hw) {
            hw = hw || {};
            if (!hw[day]) hw[day] = [];
            var ex = -1;
            for (var i = 0; i < hw[day].length; i++) { if (hw[day][i].n === n) { ex = i; break; } }
            if (ex >= 0) hw[day][ex].t = txt; else hw[day].push({ n: n, t: txt });
            FirebaseDB.set(path, hw).then(function() {
                document.getElementById("hw-text").value = "";
                document.getElementById("hw-msg").innerHTML = '<div class="msg ok">Добавлено</div>';
                setTimeout(function() { document.getElementById("hw-msg").innerHTML = ""; }, 2000);
                loadHW();
            });
        });
    }

    function delHW(day, n) {
        var path = "hw_" + getWeekKey(hwWeekOffset);
        FirebaseDB.get(path, function(hw) {
            hw = hw || {};
            if (hw[day]) {
                hw[day] = hw[day].filter(function(h) { return h.n !== n; });
                if (!hw[day].length) delete hw[day];
            }
            FirebaseDB.set(path, hw).then(function() { loadHW(); });
        });
    }

    function addRep() {
        var day = +document.getElementById("rep-day").value;
        var n = +document.getElementById("rep-num").value;
        var name = document.getElementById("rep-subject").value;
        var room = document.getElementById("rep-room").value.trim();
        var origName = getLessonName(day, n);
        if (!name) { document.getElementById("rep-msg").innerHTML = '<div class="msg err">Выбери предмет</div>'; return; }

        var now = new Date();
        var monday = getMonday(now);
        var targetDate = new Date(monday);
        targetDate.setDate(monday.getDate() + (day - 1));
        var dateStr = formatDate(targetDate);
        var key = String(day) + "_" + dateStr;

        var hwPath = "hw_" + getWeekKey(0);

        FirebaseDB.get(hwPath, function(hwBefore) {
            hwBefore = hwBefore || {};

            FirebaseDB.get("reps", function(reps) {
                reps = reps || {};
                if (!reps[key]) reps[key] = [];
                var ex = -1;
                for (var i = 0; i < reps[key].length; i++) { if (reps[key][i].n === n) { ex = i; break; } }
                var repObj = { n: n, name: name, room: room, hwSnapshot: hwBefore };
                if (ex >= 0) reps[key][ex] = repObj; else reps[key].push(repObj);
                FirebaseDB.set("reps", reps);

                document.getElementById("rep-room").value = "";
                document.getElementById("rep-msg").innerHTML = '<div class="msg ok">Замена добавлена</div>';
                setTimeout(function() { document.getElementById("rep-msg").innerHTML = ""; }, 2000);
                loadRep();
            });

            if (origName !== name) {
                var hw = JSON.parse(JSON.stringify(hwBefore));

                var slotHw = hw[String(day)] || [];
                var slotIdx = -1;
                for (var i = 0; i < slotHw.length; i++) { if (slotHw[i].n === n) { slotIdx = i; break; } }
                if (slotIdx >= 0) {
                    var origHwText = slotHw[slotIdx].t;
                    slotHw.splice(slotIdx, 1);
                    if (!slotHw.length) delete hw[String(day)]; else hw[String(day)] = slotHw;

                    var nearest = findNearestLesson(origName, day, n);
                    if (nearest) {
                        var nk = String(nearest.day);
                        if (!hw[nk]) hw[nk] = [];
                        var found = false;
                        for (var j = 0; j < hw[nk].length; j++) {
                            if (hw[nk][j].n === nearest.num) { hw[nk][j].t += "\n\n" + origName + " (перенесено из " + DN[day] + "): " + origHwText; found = true; break; }
                        }
                        if (!found) hw[nk].push({ n: nearest.num, t: origName + " (перенесено из " + DN[day] + "): " + origHwText });
                    } else {
                        var nextPath = "hw_" + getWeekKey(1);
                        FirebaseDB.get(nextPath, function(nextHw) {
                            nextHw = nextHw || {};
                            var nk2 = String(day);
                            if (!nextHw[nk2]) nextHw[nk2] = [];
                            nextHw[nk2].push({ n: n, t: origName + " (перенесено из " + DN[day] + "): " + origHwText });
                            FirebaseDB.set(nextPath, nextHw);
                        });
                    }
                }

                var moved = [];
                for (var d = 1; d <= 5; d++) {
                    var dHw = hw[String(d)];
                    if (!dHw) continue;
                    for (var i = dHw.length - 1; i >= 0; i--) {
                        var hName = getLessonName(d, dHw[i].n);
                        if (hName === name) {
                            moved.push({ fromDay: d, text: dHw[i].t });
                            dHw.splice(i, 1);
                        }
                    }
                    if (!dHw.length) delete hw[String(d)]; else hw[String(d)] = dHw;
                }

                if (!hw[String(day)]) hw[String(day)] = [];
                for (var m = 0; m < moved.length; m++) {
                    var label = name + " (перенесено из " + DN[moved[m].fromDay] + "):";
                    var existing = false;
                    for (var j = 0; j < hw[String(day)].length; j++) {
                        if (hw[String(day)][j].n === n) {
                            hw[String(day)][j].t += "\n\n" + label + " " + moved[m].text;
                            existing = true;
                            break;
                        }
                    }
                    if (!existing) {
                        hw[String(day)].push({ n: n, t: label + " " + moved[m].text });
                    }
                }

                FirebaseDB.set(hwPath, hw).then(function() { loadHW(); });
            }
        });
    }

    function delRep(key, n) {
        FirebaseDB.get("reps", function(reps) {
            reps = reps || {};
            var repEntry = null;
            if (reps[key]) {
                for (var i = 0; i < reps[key].length; i++) {
                    if (reps[key][i].n === n) { repEntry = reps[key][i]; break; }
                }
                reps[key] = reps[key].filter(function(r) { return r.n !== n; });
                if (!reps[key].length) delete reps[key];
            }
            FirebaseDB.set("reps", reps);
            loadRep();

            if (repEntry && repEntry.hwSnapshot) {
                var hwPath = "hw_" + getWeekKey(0);
                FirebaseDB.set(hwPath, repEntry.hwSnapshot).then(function() { loadHW(); });
            }
        });
    }

    var BELL_DATA = {
        "45": {name:"45 минут", bells:[["08:30","09:15"],["09:25","10:10"],["10:20","11:05"],["11:15","12:00"],["12:10","12:55"],["13:15","14:00"],["14:10","14:55"],["15:05","15:50"],["16:00","16:45"]]},
        "35": {name:"35 минут", bells:[["08:30","09:05"],["09:10","09:45"],["09:50","10:25"],["10:30","11:05"],["11:10","11:45"],["11:50","12:25"],["12:30","13:05"],["13:10","13:45"],["13:50","14:25"]]},
        "30": {name:"30 минут", bells:[["08:30","09:00"],["09:05","09:35"],["09:40","10:10"],["10:15","10:45"],["10:50","11:20"],["11:25","11:55"],["12:00","12:30"],["12:35","13:05"],["13:10","13:40"]]},
        "from5": {name:"с 5-го урока", bells:[["08:30","09:15"],["09:25","10:10"],["10:20","11:05"],["11:15","12:00"],["12:05","12:35"],["12:40","13:10"],["13:15","13:45"],["13:50","14:20"],["14:25","14:55"]]}
    };

    var BELL_OPTIONS = [
        {val:"45",label:"45 минут"},
        {val:"35",label:"35 минут"},
        {val:"30",label:"30 минут"},
        {val:"from5",label:"с 5-го урока"}
    ];

    function buildBellGrid() {
        var grid = document.getElementById("bell-grid");
        var html = "";
        for (var d = 1; d <= 5; d++) {
            html += '<div class="bell-row"><span class="bell-day">' + DN[d] + '</span><select id="bell-day-' + d + '" onchange="setBellForDay(' + d + ')">';
            for (var i = 0; i < BELL_OPTIONS.length; i++) {
                html += '<option value="' + BELL_OPTIONS[i].val + '">' + BELL_OPTIONS[i].label + '</option>';
            }
            html += '</select></div>';
        }
        grid.innerHTML = html;
        loadBellModes();
    }

    function loadBellModes() {
        FirebaseDB.get("bell_modes", function(data) {
            data = data || {};
            for (var d = 1; d <= 5; d++) {
                var sel = document.getElementById("bell-day-" + d);
                if (sel) sel.value = data[String(d)] || "45";
            }
            var firstMode = data["1"] || "45";
            showBellTable(firstMode);
        });
    }

    function setBellForDay(day) {
        var mode = document.getElementById("bell-day-" + day).value;
        FirebaseDB.get("bell_modes", function(data) {
            data = data || {};
            data[String(day)] = mode;
            FirebaseDB.set("bell_modes", data);
            showBellTable(mode);
        });
    }

    function showBellTable(mode) {
        var bellData = BELL_DATA[mode] || BELL_DATA["45"];
        var html = "";
        for (var i = 0; i < bellData.bells.length; i++) {
            html += '<div class="item"><div class="item-top"><span class="item-title">' + (i+1) + ' урок</span><span class="item-title">' + bellData.bells[i][0] + ' \u2013 ' + bellData.bells[i][1] + '</span></div></div>';
        }
        document.getElementById("bell-table").innerHTML = html;
    }
    </script>

    <div id="update-banner" class="update-banner hidden">
        <div class="update-content">
            <span class="update-icon">🔄</span>
            <span class="update-text">Доступна новая версия приложения</span>
            <button class="update-btn" onclick="applyUpdate()">Обновить</button>
            <button class="update-dismiss" onclick="dismissUpdate()">×</button>
        </div>
    </div>

    <script>
    if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                if (refreshing) return;
                refreshing = true;
                showUpdateBanner();
            });
            setInterval(function() { reg.update(); }, 60000);
        }).catch(function(){});
    }

    function showUpdateBanner() {
        document.getElementById('update-banner').classList.remove('hidden');
    }

    function dismissUpdate() {
        document.getElementById('update-banner').classList.add('hidden');
    }

    function applyUpdate() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister(); });
            });
        }
        caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
        });
        location.reload(true);
    }
    </script>
