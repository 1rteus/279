<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="📚">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="manifest.json">
    <title>📚</title>
    <link rel="stylesheet" href="style.css">
    <meta name="app-version" content="1.2.0">
</head>
<body>
    <div id="ban-screen" class="ban hidden">
        <div><h2>Доступ запрещён</h2><p>Ваше устройство заблокировано.</p></div>
    </div>

    <div id="app" class="container hidden">
        <div class="header">
            <h1>📚</h1>
            <div class="date" id="current-date"></div>
        </div>

        <div class="week-nav">
            <button class="arrow-btn" onclick="changeWeek(-1)">&#8249;</button>
            <span id="week-label" class="week-label"></span>
            <button class="arrow-btn" onclick="changeWeek(1)">&#8250;</button>
        </div>

        <div class="days" id="day-selector"></div>

        <div class="now-banner" id="now-banner"></div>

        <div id="schedule"></div>

        <div class="footer"><a href="admin.html">админ</a></div>
    </div>

    <div id="update-banner" class="update-banner hidden">
        <div class="update-content">
            <span class="update-icon">🔄</span>
            <span class="update-text">Доступна новая версия приложения</span>
            <button class="update-btn" onclick="applyUpdate()">Обновить</button>
            <button class="update-dismiss" onclick="dismissUpdate()">×</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="app.js"></script>
    <script>
    if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
            reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'activated') {
                        location.reload();
                    }
                });
            });
        }).catch(function(){});
    }
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, false);

    var CURRENT_VERSION = document.querySelector('meta[name="app-version"]').content;

    function checkForUpdates() {
        fetch('index.html?v=' + Date.now(), { cache: 'no-cache' })
            .then(function(r) { return r.text(); })
            .then(function(html) {
                var match = html.match(/meta name="app-version" content="([^"]+)"/);
                if (match && match[1] !== CURRENT_VERSION) {
                    showUpdateBanner();
                }
            })
            .catch(function() {});
    }

    function showUpdateBanner() {
        document.getElementById('update-banner').classList.remove('hidden');
    }

    function dismissUpdate() {
        document.getElementById('update-banner').classList.add('hidden');
    }

    function applyUpdate() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister(); });
            });
        }
        caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
        });
        location.reload(true);
    }

    setInterval(checkForUpdates, 60000);
    checkForUpdates();
    </script>
</body>
</html>
