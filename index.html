<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="📚">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="manifest.json">
    <title>📚</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container">
        <div class="header">
            <h1>📚</h1>
            <div class="date" id="current-date"></div>
        </div>

        <div class="week-nav">
            <button class="arrow-btn" onclick="changeWeek(-1)">&#8249;</button>
            <span id="week-label" class="week-label"></span>
            <button class="arrow-btn" onclick="changeWeek(1)">&#8250;</button>
        </div>

        <div class="days" id="day-selector"></div>

        <div class="now-banner hidden" id="now-banner"></div>

        <div id="schedule"></div>

        <div class="footer"><a href="admin.html">админ</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="app.js"></script>
    <script>
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, false);
    </script>
</body>
</html>
